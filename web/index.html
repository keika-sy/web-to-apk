<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web to APK — Ubah Website Jadi Aplikasi Android</title>
<style>
  :root { --tema:#2563EB; --gelap:#0f172a; --abu:#64748b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#f1f5f9; color:var(--gelap); }
  .wrap { max-width:560px; margin:0 auto; padding:32px 16px 64px; }
  header { text-align:center; margin-bottom:24px; }
  header .logo { font-size:44px; }
  h1 { margin:8px 0 4px; font-size:26px; }
  header p { margin:0; color:var(--abu); }
  .card { background:#fff; border-radius:16px; padding:24px; box-shadow:0 4px 24px rgba(15,23,42,.08); }
  label { display:block; font-weight:600; font-size:14px; margin:16px 0 6px; }
  label:first-child { margin-top:0; }
  input { width:100%; padding:12px 14px; border:1.5px solid #cbd5e1; border-radius:10px; font-size:15px; }
  input:focus { outline:none; border-color:var(--tema); }
  input[type=color] { padding:4px; height:48px; }
  .hint { font-size:12px; color:var(--abu); margin-top:4px; }
  button { width:100%; margin-top:24px; padding:14px; border:0; border-radius:10px; background:var(--tema); color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.55; cursor:wait; }
  #status { margin-top:20px; font-size:14px; display:none; }
  #status .run { padding:10px 12px; border:1px solid #e2e8f0; border-radius:10px; margin-top:8px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .badge { font-size:12px; font-weight:700; padding:3px 8px; border-radius:99px; background:#e0e7ff; color:#3730a3; white-space:nowrap; }
  .badge.ok { background:#dcfce7; color:#166534; }
  .badge.fail { background:#fee2e2; color:#991b1b; }
  a.dl { color:var(--tema); font-weight:700; }
  footer { text-align:center; color:var(--abu); font-size:13px; margin-top:24px; }
  footer a { color:var(--tema); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">&#128241;</div>
    <h1>Web to APK</h1>
    <p>Isi form, tunggu beberapa menit, download APK-nya.</p>
  </header>

  <form class="card" id="form">
    <label for="web_url">URL Website *</label>
    <input id="web_url" type="text" inputmode="url" placeholder="https://websitekamu.com" required>

    <label for="app_name">Nama Aplikasi *</label>
    <input id="app_name" type="text" maxlength="50" placeholder="Aplikasi Saya" required>

    <label for="package_id">Package ID *</label>
    <input id="package_id" type="text" placeholder="com.contoh.app" pattern="[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+" required>
    <div class="hint">Huruf kecil, minimal satu titik. Contoh: com.tokosaya.app</div>

    <label for="icon_url">URL Icon (opsional)</label>
    <input id="icon_url" type="text" inputmode="url" placeholder="https://websitekamu.com/icon.png">
    <div class="hint">Gambar persegi PNG/JPG. Kosongkan untuk icon bawaan.</div>

    <label for="theme_color">Warna Tema</label>
    <input id="theme_color" type="color" value="#2563EB">

    <button type="submit" id="btn">&#128640; Build APK Saya</button>
    <div id="status"></div>
  </form>

  <footer>
    Build dikerjakan oleh GitHub Actions &middot;
    <a href="https://github.com/keika-sy/web-to-apk/releases" target="_blank" rel="noopener">Semua hasil build (Releases)</a>
  </footer>
</div>

<script>
// ==== KONFIGURASI ====
// Isi dengan URL Cloudflare Worker setelah backend di-deploy (lihat folder backend/).
// Selama kosong, tombol build membuka halaman GitHub Actions untuk trigger manual.
const BACKEND_URL = "";
const ACTIONS_URL = "https://github.com/keika-sy/web-to-apk/actions/workflows/build-apk.yml";

const form = document.getElementById("form");
const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");

function showStatus(html) { statusEl.style.display = "block"; statusEl.innerHTML = html; }

async function pollStatus() {
  try {
    const r = await fetch(BACKEND_URL + "/status");
    const data = await r.json();
    if (!data.runs || !data.runs.length) return;
    let html = "<b>Build terakhir:</b>";
    for (const run of data.runs.slice(0, 3)) {
      const badge = run.conclusion === "success" ? '<span class="badge ok">Selesai</span>'
        : run.conclusion === "failure" ? '<span class="badge fail">Gagal</span>'
        : '<span class="badge">Proses…</span>';
      html += `<div class="run"><span>#${run.run_number} — ${run.status}</span>${badge}</div>`;
    }
    html += '<p>Kalau sudah <b>Selesai</b>, APK-nya ada di <a class="dl" href="https://github.com/keika-sy/web-to-apk/releases" target="_blank" rel="noopener">halaman Releases</a>.</p>';
    showStatus(html);
  } catch (e) { /* status bersifat informatif saja */ }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const payload = {
    web_url: document.getElementById("web_url").value.trim(),
    app_name: document.getElementById("app_name").value.trim(),
    package_id: document.getElementById("package_id").value.trim().toLowerCase(),
    icon_url: document.getElementById("icon_url").value.trim(),
    theme_color: document.getElementById("theme_color").value.toUpperCase(),
  };

  if (!BACKEND_URL) {
    showStatus(`Backend belum dihubungkan. Untuk build sekarang, trigger manual di GitHub Actions `
      + `(login dulu sebagai pemilik repo), isi persis data form ini:<br>`
      + `<a class="dl" href="${ACTIONS_URL}" target="_blank" rel="noopener">Buka halaman Run workflow</a>`);
    return;
  }

  btn.disabled = true; btn.textContent = "Mengirim…";
  try {
    const r = await fetch(BACKEND_URL + "/build", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Gagal memicu build");
    showStatus("&#9989; Build dimulai! Biasanya 3–6 menit. Halaman ini cek status otomatis tiap 20 detik.");
    pollStatus();
    setInterval(pollStatus, 20000);
  } catch (err) {
    showStatus("&#10060; " + err.message);
  } finally {
    btn.disabled = false; btn.innerHTML = "&#128640; Build APK Saya";
  }
});
</script>
</body>
</html>
