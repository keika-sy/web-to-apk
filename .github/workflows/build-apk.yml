# Web to APK — build workflow (dipicu manual / lewat form web)
name: Build APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "URL website yang mau dijadikan APK"
        required: true
        type: string
      app_name:
        description: "Nama aplikasi"
        required: true
        type: string
      package_id:
        description: "Package ID (contoh: com.contoh.app)"
        required: true
        type: string
      icon_url:
        description: "URL icon (PNG/JPG, persegi) - kosongkan untuk icon default"
        required: false
        type: string
        default: ""
      theme_color:
        description: "Warna tema (hex)"
        required: false
        type: string
        default: "#2563EB"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout template
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Inject URL / nama / package / warna
        run: |
          python3 scripts/customize.py \
            --url "${{ inputs.web_url }}" \
            --name "${{ inputs.app_name }}" \
            --package "${{ inputs.package_id }}" \
            --color "${{ inputs.theme_color }}"

      - name: Pakai icon custom (kalau diisi)
        if: ${{ inputs.icon_url != '' }}
        run: |
          curl -L --fail -o /tmp/icon-src "${{ inputs.icon_url }}"
          python3 -m pip install --quiet pillow
          python3 scripts/make_icons.py /tmp/icon-src

      - name: Siapkan keystore dari Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/webtoapk.jks
            echo "Keystore tetap dipakai (signature konsisten antar build)."
          else
            echo "Secret KEYSTORE_BASE64 belum diset - APK akan di-sign debug key."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Siapkan file APK
        run: |
          mkdir -p out
          SAFE_NAME=$(echo "${{ inputs.app_name }}" | tr ' ' '-' | tr -cd 'A-Za-z0-9._-')
          cp app/build/outputs/apk/release/app-release.apk "out/${SAFE_NAME}.apk"
          ls -lh out/

      - name: Upload sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      - name: Terbitkan sebagai Release (link download publik)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          NOTES="Web to APK build #${{ github.run_number }}

          - App: ${{ inputs.app_name }}
          - URL: ${{ inputs.web_url }}
          - Package: ${{ inputs.package_id }}"
          gh release create "$TAG" out/*.apk --title "${{ inputs.app_name }} (build ${{ github.run_number }})" --notes "$NOTES" \
            || gh release upload "$TAG" out/*.apk --clobber
          {
            echo "## APK jadi"
            echo ""
            echo "Download: https://github.com/${{ github.repository }}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
